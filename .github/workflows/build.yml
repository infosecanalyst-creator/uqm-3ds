name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: UQM 0.8.0 source
        run: |
          curl -fL --retry 3 -o uqm-src.tgz https://downloads.sourceforge.net/project/sc2/UQM/0.8/uqm-0.8.0-src.tgz
          tar xzf uqm-src.tgz
          python3 tools/patch_uqm.py uqm-0.8.0
      - name: Build
        run: make -f Makefile.3ds -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota must never fail the build (delivery is the builds branch)
        with:
          name: uqm-3ds
          path: uqm.3dsx
